<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}} · EXPECTOPATRONUS</title>
    <meta name="description" content="{{META_DESC}}" />
    <meta name="keywords" content="{{META_KEYWORDS}}" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:type" content="article" />
    <meta property="og:description" content="{{OG_DESC}}" />
    <link rel="shortcut icon" href="../../home/logo.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          if (t === 'light') document.documentElement.dataset.theme = 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="../../home/design-tokens.css" />
    <style>
      .icon { display: inline-flex; align-items: center; justify-content: center; width: 1em; height: 1em; vertical-align: -0.125em; color: currentColor; flex-shrink: 0; }
      .icon svg { width: 100%; height: 100%; }
      .icon-sm { width: 0.82em; height: 0.82em; }
      .icon-lg { width: 1.3em; height: 1.3em; }
      .theme-icon { color: var(--accent-rust); }
      /* 页面头部：eyebrow + h1 + 导语 + meta */
      .page-head {
        max-width: var(--container);
        margin: 0 auto;
        padding: var(--sp-10) var(--sp-6) var(--sp-6);
        border-bottom: 1px solid var(--line);
      }
      .page-head .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--accent-rust);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: var(--sp-4);
      }
      .page-head h1 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: clamp(2rem, 4vw, 3.2rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--text);
        margin: 0 0 var(--sp-4);
      }
      .page-head h1 em {
        font-style: italic;
        color: var(--accent-rust);
        font-weight: 400;
      }
      .page-head p {
        font-family: var(--font-serif);
        font-size: 1rem;
        color: var(--text-soft);
        max-width: 680px;
        line-height: 1.8;
      }
      .page-head .meta {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-4);
        margin-top: var(--sp-5);
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--text-dim);
      }
      .page-head .meta span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .page-head .meta i {
        color: var(--accent-rust);
      }

      /* 封面大图 */
      .hero-image {
        max-width: var(--container);
        margin: var(--sp-6) auto 0;
        padding: 0 var(--sp-6);
      }
      .hero-image img {
        width: 100%;
        border-radius: var(--r-lg);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-md);
        display: block;
      }

      /* 正文区 */
      .article-body {
        max-width: var(--container-narrow);
        margin: 0 auto;
        padding: var(--sp-8) var(--sp-6) var(--sp-10);
      }

      /* 章节编号标签 */
      .section-marker {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--accent-rust);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        margin-bottom: var(--sp-3);
      }

      /* 正文标题 */
      .article-body h2 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 1.55rem;
        letter-spacing: -0.01em;
        color: var(--text);
        margin: 0 0 var(--sp-5);
      }
      .article-body h3 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 1.15rem;
        color: var(--text);
        margin: 0 0 var(--sp-3);
      }

      /* 正文段落 */
      .article-body p {
        font-family: var(--font-serif);
        color: var(--text-soft);
        line-height: 1.85;
        font-size: 1rem;
        margin: 0 0 var(--sp-5);
      }
      .article-body strong {
        color: var(--text);
        font-weight: 600;
      }

      /* 关键词高亮（用于正文中需要突出的术语） */
      .article-body .hl {
        background: linear-gradient(120deg, transparent 0%, rgba(201, 119, 47, 0.15) 50%, transparent 100%);
        padding: 0 4px;
        border-radius: 4px;
        color: var(--accent-rust);
        font-weight: 600;
      }

      /* 信息提示框（左侧边线强调） */
      .info-box {
        padding: var(--sp-5) var(--sp-6);
        border-left: 3px solid var(--accent-rust);
        background: rgba(201, 119, 47, 0.06);
        border-radius: 0 var(--r-lg) var(--r-lg) 0;
        font-family: var(--font-serif);
        color: var(--text-soft);
        font-size: 0.95rem;
        line-height: 1.7;
        margin-bottom: var(--sp-6);
      }
      .info-box strong {
        color: var(--text);
      }
      .info-box-jade {
        border-left-color: var(--accent-jade);
        background: rgba(58, 141, 123, 0.08);
      }

      /* 时间线（横向流程 / 事件列表） */
      .timeline {
        margin: var(--sp-3) 0 var(--sp-7);
        padding: var(--sp-5) var(--sp-6);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        background: var(--bg-card);
      }
      .timeline .tl-item {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: var(--sp-4);
        padding: var(--sp-3) 0;
        border-bottom: 1px dashed var(--line);
      }
      .timeline .tl-item:last-child {
        border-bottom: none;
      }
      .timeline .tl-time {
        color: var(--accent-rust);
        font-weight: 600;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        padding-top: 4px;
      }
      .timeline .tl-text {
        color: var(--text-soft);
        line-height: 1.8;
        font-size: 0.95rem;
        font-family: var(--font-serif);
      }
      .timeline .tl-text strong {
        color: var(--text);
      }

      /* 重点引用块 */
      .pull-quote {
        margin: var(--sp-8) 0;
        padding: var(--sp-6);
        border-radius: var(--r-xl);
        background: var(--bg-card);
        border: 1px solid var(--line);
        position: relative;
      }
      .pull-quote::before {
        content: '\201C';
        position: absolute;
        top: -32px;
        left: var(--sp-6);
        font-size: 5rem;
        color: var(--accent-rust);
        font-family: Georgia, serif;
        line-height: 1;
        opacity: 0.5;
      }
      .pull-quote p {
        font-family: var(--font-serif);
        font-style: italic;
        color: var(--text);
        line-height: 1.9;
        font-size: 1.05rem;
        margin: 0;
      }

      /* 平台/相关链接列表 */
      .platform-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        margin-top: var(--sp-5);
        margin-bottom: var(--sp-7);
      }
      .platform-list a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: var(--bg-card);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        text-decoration: none;
        color: var(--text);
        font-size: 0.88rem;
        transition: all 0.2s;
        font-family: var(--font-serif);
      }
      .platform-list a:hover {
        border-color: var(--accent-rust);
        transform: translateX(3px);
      }
      .platform-list i {
        color: var(--accent-rust);
      }

      /* 标签行 */
      .tags-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: var(--sp-4);
      }
      .tags-row a {
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-family: var(--font-mono);
        font-weight: 500;
        background: var(--bg-card);
        border: 1px solid var(--line);
        color: var(--text-soft);
        text-decoration: none;
        transition: all 0.2s;
      }
      .tags-row a:hover {
        color: var(--accent-rust);
        border-color: var(--accent-rust);
      }

      /* CTA 跳转框（封面 + 按钮） */
      .cta-box {
        margin: var(--sp-6) 0;
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: var(--sp-6);
        padding: var(--sp-6);
        border-radius: var(--r-xl);
        background: var(--bg-card);
        border: 1px solid var(--line);
        align-items: center;
      }
      .cta-box .cover img {
        width: 100%;
        border-radius: var(--r-lg);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-md);
        display: block;
      }
      .cta-box .content h3 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 1.2rem;
        margin: 0 0 var(--sp-3);
      }
      .cta-box .content p {
        font-family: var(--font-serif);
        color: var(--text-soft);
        line-height: 1.7;
        font-size: 0.9rem;
        margin: 0 0 var(--sp-4);
      }
      .cta-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 22px;
        border-radius: var(--r-md);
        background: var(--accent-rust);
        color: var(--text);
        text-decoration: none;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.2s;
        margin-right: var(--sp-3);
      }
      .cta-btn:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .cta-btn i {
        color: var(--text);
      }

      /* 响应式 */
      @media (max-width: 820px) {
        .cta-box {
          grid-template-columns: 1fr;
        }
        .timeline .tl-item {
          grid-template-columns: 70px 1fr;
          gap: var(--sp-3);
        }
        .page-head {
          padding-top: var(--sp-8);
        }
      }
    </style>
  </head>
  <body>
    <nav class="site-nav">
      <div class="nav-inner">
        <a href="../../index.html" class="brand"><span class="logo">E</span><span>expectopatronus</span></a>
        <div class="nav-links" id="nav-links">
          <a href="../../index.html">首页</a>
          <a href="../../home/home.html">文章</a>
          <a href="../../home/home.html?cat=健康生活">健康生活</a>
          <a href="../deepseek/deepseek.html">DeepSeek</a>
          <a href="../../nav/index.html" target="_blank"
            >导航站 <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M21 3l-9 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          ></a>
        </div>
        <button class="menu-toggle" id="menu-toggle" aria-label="菜单">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button id="theme-toggle" class="theme-btn" aria-label="主题切换"><svg class="icon theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13.5A9 9 0 0 1 10.5 3a7.5 7.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      </div>
    </nav>

    <section class="page-head">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{TITLE}}</h1>
      <p>{{SUMMARY_HTML}}</p>
      <div class="meta">
        <span><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 20c1.2-3.5 4-5 6.5-5s5.3 1.5 6.5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> {{AUTHOR}}</span>
        <span><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> {{DATE_TODAY}}</span>
        <span><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 7.5v5l3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> {{DURATION}}</span>
        <span><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7.5l9 4.5 9-4.5-9-4.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 12l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg> 视频 · 搬运整理</span>
      </div>
    </section>

    <div class="hero-image">
      <img loading="lazy" alt="视频封面" src="{{COVER_URL}}" />
    </div>

    <article class="article-body">
      {{CONTENT_HTML}}
    </article>

    <footer class="site-footer">
      <div class="footer-content">
        <div>
          <div class="footer-brand">expectopatronus</div>
          <div class="footer-meta">© 2025 · {{FOOTER_META}}</div>
        </div>
        <div class="footer-social">
          <a href="https://github.com/expectopatronus00" target="_blank" aria-label="GitHub"
            ><svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.26c0 4.53 2.87 8.37 6.84 9.73.5.09.68-.22.68-.48l-.01-1.7c-2.78.62-3.37-1.36-3.37-1.36-.45-1.18-1.11-1.5-1.11-1.5-.91-.63.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.29.1-2.69 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 7.07c.85 0 1.7.12 2.5.35 1.91-1.32 2.75-1.05 2.75-1.05.55 1.4.2 2.43.1 2.69.64.72 1.03 1.64 1.03 2.76 0 3.94-2.35 4.8-4.58 5.06.36.32.68.94.68 1.9l-.01 2.82c0 .27.18.58.69.48A10.03 10.03 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/></svg>
          ></a>
          <a href="mailto:18821772508@163.com" aria-label="Email"><svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 7l9 7 9-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
      </div>
    </footer>

    <button class="floating-top" id="back-to-top" aria-label="返回顶部"><svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

    <script>
      (function () {
        var MOON_SVG = '<path d="M21 13.5A9 9 0 0 1 10.5 3a7.5 7.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>';
        var SUN_SVG = '<circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
        var saved = localStorage.getItem('theme') || 'dark';
        if (saved === 'light') document.documentElement.dataset.theme = 'light';
        var btnSvg = document.querySelector('#theme-toggle svg');
        if (btnSvg) btnSvg.innerHTML = saved === 'light' ? SUN_SVG : MOON_SVG;
        var btn = document.getElementById('theme-toggle');
        if (btn)
          btn.addEventListener('click', function () {
            var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = next;
            localStorage.setItem('theme', next);
            var btnSvg2 = document.querySelector('#theme-toggle svg');
            if (btnSvg2) btnSvg2.innerHTML = next === 'light' ? SUN_SVG : MOON_SVG;
          });
        var back = document.getElementById('back-to-top');
        window.addEventListener('scroll', function () {
          if (back) back.classList.toggle('visible', window.scrollY > 300);
        });
        if (back)
          back.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        var menuBtn = document.getElementById('menu-toggle');
        var navLinks = document.getElementById('nav-links');
        if (menuBtn && navLinks) {
          menuBtn.addEventListener('click', function () {
            navLinks.classList.toggle('is-open');
          });
        }
        var cta = document.getElementById('cta-link');
        if (cta) {
          cta.addEventListener('click', function (e) {
            e.preventDefault();
            var url = this.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(window.location.href).then(function () {
                window.open(url, '_blank', 'noopener');
              });
            } else {
              window.open(url, '_blank', 'noopener');
            }
          });
        }
      })();
    </script>
  </body>
</html>
