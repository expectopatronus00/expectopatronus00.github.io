<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {

    --ink:#e7ebff;
    --mute:#8a93bf;
    --cyan:#00e5ff;
    --blue:#3b82ff;
    --violet:#8b5cf6;
    --pink:#ff3bd4;
    --gold:#ffd166;
    --line:rgba(120,150,255,.22);
    --line-strong:rgba(120,150,255,.40);

  [data-theme="light"]{
    --bg-0:#f6f8ff;
    --bg-1:#ffffff;
    --ink:#0b1230;
    --mute:#4a5580;
    --cyan:#008cff;
    --blue:#3b82ff;

    --line:rgba(20,40,120,.14);

  html, body {

      radial-gradient(1200px 700px at 15% 10%, rgba(59,130,255,.22), transparent 60%),
      radial-gradient(900px 600px at 85% 90%, rgba(139,92,246,.20), transparent 60%),

    -webkit-font-smoothing: antialiased;
    transition: background .35s ease, color .35s ease;
  }
  [data-theme="light"] html,
  [data-theme="light"] body {
    background:
      radial-gradient(1200px 700px at 15% 10%, rgba(59,130,255,.15), transparent 60%),
      radial-gradient(900px 600px at 85% 90%, rgba(139,92,246,.12), transparent 60%),
      linear-gradient(180deg,#f6f8ff 0%,#ffffff 55%,#f0f4ff 100%);
  }

  /* ── 星空 canvas ─────────────────────────────── */
  #stars, #glow {
    position:fixed; inset:0; width:100%; height:100%;
  }
  #stars { z-index:0; opacity:.85; }
  [data-theme="light"] #stars { opacity:.08; }
  #glow {
    z-index:1;
    background:
      radial-gradient(600px 400px at 50% 40%, rgba(0,229,255,.12), transparent 60%),
      radial-gradient(800px 500px at 50% 40%, rgba(139,92,246,.10), transparent 60%);

    pointer-events:none;
    transition: opacity .35s ease;
  }
  [data-theme="light"] #glow {
    background:
      radial-gradient(600px 400px at 50% 40%, rgba(59,130,255,.18), transparent 60%),
      radial-gradient(800px 500px at 50% 40%, rgba(139,92,246,.12), transparent 60%);
    opacity:.5;
  }

  /* ── 布局 ───────────────────────────────────── */
  .stage{
    position:relative; z-index:10;
    height:100%;
    display:grid; place-items:center;
  }
  .card{
    width:min(92vw, 880px);
    padding:56px 48px;
    border-radius:24px;
    background:linear-gradient(140deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
    border:1px solid var(--line);
    box-shadow:
      0 0 0 1px rgba(59,130,255,.10) inset,
      0 30px 80px -20px rgba(0,0,0,.7),
      0 0 120px -30px rgba(0,229,255,.35);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    text-align:center;
    position:relative;
    animation: rise 900ms cubic-bezier(.2,.7,.2,1) both;
    transition: background .35s ease, border-color .35s ease, box-shadow .35s ease;
  }
  [data-theme="light"] .card{
    background: linear-gradient(140deg, rgba(255,255,255,.96), rgba(246,248,255,.92));
    border:1px solid var(--line);
    box-shadow:
      0 0 0 1px rgba(59,130,255,.08) inset,
      0 20px 50px -15px rgba(30,60,150,.25),
      0 0 60px -20px rgba(59,130,255,.15);
  }
  .card::before, .card::after{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:24px;
    padding:1px;
    background:conic-gradient(from -20deg at 50% 50%, transparent, rgba(0,229,255,.8) 20%, transparent 40%, transparent 60%, rgba(139,92,246,.8) 80%, transparent);

    -webkit-mask-composite:xor; mask-composite:exclude;
    pointer-events:none;
    opacity:.7;
    animation: spin 18s linear infinite;
    transition: opacity .35s ease;

  [data-theme="light"] .card::before,
  [data-theme="light"] .card::after{ opacity:.35; }

  @keyframes rise{ from{opacity:0; transform:translateY(24px) scale(.98)} to{opacity:1; transform:none} }

  .btn:hover{

    color:#3b82ff;
    border-color:rgba(59,130,255,.6);

  /* ── 主题切换 ─────────────────────────────────── */
  #theme-toggle{
    position:fixed;top:18px;right:18px;z-index:60;

  [data-theme="light"] #theme-toggle{
    color:#1a2764;
    background: rgba(255,255,255,.85);
    border-color:rgba(59,130,255,.4);
    box-shadow: 0 4px 16px -4px rgba(59,130,255,.3);

  [data-theme="light"] #theme-toggle:hover{
    color:#3b82ff;
    border-color:rgba(59,130,255,.7);
    background:#fff;
    transform: scale(1.08) rotate(-15deg);
    box-shadow: 0 6px 22px -4px rgba(59,130,255,.45);
  }

  /* ── 滚动条 & 选中文本 ──────────────────────────── */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#00e5ff,#3b82ff,#8b5cf6);
    border-radius:10px;border:2px solid #03040a;
  }
  [data-theme="light"] ::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#008cff,#3b82ff,#6d28d9);

  }

  [data-theme="light"] ::selection{ background:rgba(59,130,255,.25); color:#0b1230; }

  /* ── 天气跑马 ────────────────────────────────── */
  .ticker{
    position:fixed; top:0; left:0; right:0;

  .modal{
    position:fixed; inset:0; z-index:99;

  .modal.show{ display:grid; animation: fade .25s ease; }

  .modal-box{
    grid-area:m;

  .modal-box h3{
    font-size:1.1rem; font-weight:700; margin-bottom:12px;
    background:linear-gradient(120deg, #00e5ff, #8b5cf6);

  [data-theme="light"] .modal-box h3{
    background:linear-gradient(120deg, #008cff, #6d28d9);

  .modal-box p{ color:#b4bce0; line-height:1.75; font-size:.92rem; margin-bottom:8px; }

  }
  [data-theme="light"] .modal-box button.primary{
    background:linear-gradient(120deg, #3b82ff, #6d28d9);

  }
  .modal-box button:hover{ transform: translateY(-1px); }

  /* ── 响应式 ───────────────────────────────────── */
  @media (max-width: 1024px) and (min-width: 769px){

/* ── 星空粒子 ──────────────────────────── */
(function(){
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const count = 140;
  const stars = [];
  const mouse = { x: 9999, y: 9999 };

  function resize(){
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function init(){
    stars.length = 0;
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        z: Math.random()*1 + .2,
        r: Math.random()*1.3 + .3,
        hue: 200 + Math.random()*90,
        off: Math.random()*Math.PI*2,
      });
    }
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.off += 0.02;
      const twinkle = 0.6 + Math.sin(s.off)*0.4;
      const dx = mouse.x - s.x, dy = mouse.y - s.y;
      const d2 = dx*dx + dy*dy;
      let fx = 0, fy = 0;
      if(d2 < 16000){
        const f = (16000 - d2)/16000 * 12;
        fx = -dx/Math.sqrt(d2)*f;
        fy = -dy/Math.sqrt(d2)*f;
      }
      s.x += (Math.sin(s.off*0.3)*0.25 + fx) * s.z;
      s.y += (Math.cos(s.off*0.27)*0.25 + fy) * s.z;
      if(s.x < 0) s.x += W; if(s.x > W) s.x -= W;
      if(s.y < 0) s.y += H; if(s.y > H) s.y -= H;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * twinkle, 0, Math.PI*2);
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r*6);
      g.addColorStop(0, `hsla(${s.hue}, 90%, 70%, ${0.9*twinkle})`);
      g.addColorStop(0.4, `hsla(${s.hue+20}, 80%, 60%, ${0.25*twinkle})`);
      g.addColorStop(1, 'hsla(220,0%,0%,0)');
      ctx.fillStyle = g;
      ctx.fill();
    }
  }
  let raf = 0;
  function loop(t){ draw(t); raf = requestAnimationFrame(loop); }
  window.addEventListener('resize', () => { resize(); init(); });
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = mouse.y = 9999; });
  resize(); init(); loop(0);
})();

async function weather(){
  const bar = document.getElementById('ticker');
  const span = bar?.querySelector('span');
  if(!span) return;
  const cities = [
    {name:'郑州',  q:'Zhengzhou'},
    {name:'西安',  q:'Xian'},
    {name:'延安',  q:'Yan\'an'},
    {name:'北京',  q:'Beijing'},

    {name:'杭州',  q:'Hangzhou'},
    {name:'广州',  q:'Guangzhou'},
    {name:'深圳',  q:'Shenzhen'},
    {name:'成都',  q:'Chengdu'},
    {name:'重庆',  q:'Chongqing'},
    {name:'南京',  q:'Nanjing'},
    {name:'苏州',  q:'Suzhou'},
    {name:'武汉',  q:'Wuhan'},
    {name:'长沙',  q:'Changsha'},
    {name:'大连',  q:'Dalian'},
    {name:'青岛',  q:'Qingdao'},
    {name:'昆明',  q:'Kunming'},
    {name:'天津',  q:'Tianjin'},
    {name:'厦门',  q:'Xiamen'},
    {name:'济南',  q:'Jinan'},
  ];
  const descZh = {
    'Sunny':'晴','Clear':'晴','Partly cloudy':'多云','Overcast':'阴','Cloudy':'阴',
    'Patchy rain nearby':'有小雨','Patchy light rain':'小雨','Light rain':'小雨','Rain':'雨',
    'Heavy rain':'大雨','Thundery outbreaks':'雷雨','Thunderstorm':'雷雨',
    'Patchy snow nearby':'有小雪','Light snow':'小雪','Snow':'雪','Heavy snow':'大雪',
    'Fog':'雾','Mist':'薄雾','Patchy fog':'有雾','Windy':'大风','Blowing snow':'吹雪',
    'Freezing fog':'冻雾','Light drizzle':'毛毛雨','Drizzle':'毛毛雨','Showers':'阵雨',
    'Rainy':'雨','Snowy':'雪','Storm':'风暴','Thundershowers':'雷阵雨',
  };
  function descToZh(en){
    if(!en) return '';
    const k = Object.keys(descZh).find(x => new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(en));
    if(k) return descZh[k];
    if(/rain/i.test(en)) return '雨';
    if(/snow/i.test(en)) return '雪';
    if(/fog|mist/i.test(en)) return '雾';
    if(/cloud|overcast/i.test(en)) return '阴';
    if(/sunny|clear/i.test(en)) return '晴';
    return en;
  }
  function weatherCodeIcon(code, desc){
    if(code === 0) return '☀️';
    if([113].includes(code)) return '☀️';
    if([116,119,122].includes(code)) return '⛅';
    if([176,179,182,185].includes(code)) return '🌦️';
    if([189,192,195,198,200,227,230,232,235].includes(code)) return '🌧️';
    if([127,130,133,136,141,144,147,150,153,156,159,162,165,168,171,214,217,220,223].includes(code)) return '❄️';
    if([203,206,209,239,242,245].includes(code)) return '🌧️';
    if([248,260,263].includes(code)) return '🌫️';
    if([266,281,284,287].includes(code)) return '☀️';
    return '';
  }
  const res = await Promise.all(cities.slice(0,8).map(async c=>{
    try{
      const url = `https://wttr.in/${encodeURIComponent(c.q)}?format=j1&lang=zh`;
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) return '';
      const j = await r.json();
      const w = j.current_condition && j.current_condition[0];
      if(!w) return '';
      const t = w.temp_C || w.temp_F;
      const code = parseInt(w.weatherCode) || 0;
      const descEn = (w.weatherDesc && w.weatherDesc[0] && w.weatherDesc[0].value) || '';
      const desc = descToZh(descEn);
      const icon = weatherCodeIcon(code, descEn) || '🌤️';
      return `${c.name} ${t}° ${icon}`;
    }catch{ return ''; }
  }));
  const txt = res.filter(Boolean).join('   ·  ');
  span.textContent = txt || '天气服务暂不可用';
}
