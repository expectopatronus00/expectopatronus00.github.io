    <script>
      (function () {
        var saved = localStorage.getItem('theme') || 'dark';
        if (saved === 'light') document.documentElement.dataset.theme = 'light';
        var i = document.querySelector('#theme-toggle i');
        if (i) i.className = saved === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        var btn = document.getElementById('theme-toggle');
        if (btn)
          btn.addEventListener('click', function () {
            var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = next;
            localStorage.setItem('theme', next);
            var ii = document.querySelector('#theme-toggle i');
            if (ii) ii.className = next === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
          });
        var back = document.getElementById('back-to-top');
        window.addEventListener('scroll', function () {
          if (back) back.classList.toggle('visible', window.scrollY > 300);
        });
        if (back)
          back.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        var cta = document.getElementById('cta-link');
        if (cta) {
          cta.addEventListener('click', function (e) {
            e.preventDefault();
            var url = this.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(window.location.href).then(function () {
                window.open(url, '_blank', 'noopener');
              });
            } else {
              window.open(url, '_blank', 'noopener');
            }
          });
        }
      })();
