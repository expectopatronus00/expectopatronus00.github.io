<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>文章索引 · EXPECTOPATRONUS</title>
    <meta name="description" content="个人博客的全部文章索引，按主题、日期或标签浏览。" />
    <link rel="shortcut icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="design-tokens.css" />
    <style>
      /* SVG 图标工具类 */
      .icon { display: inline-flex; align-items: center; justify-content: center; width: 1em; height: 1em; vertical-align: -0.125em; color: currentColor; flex-shrink: 0; }
      .icon svg { width: 100%; height: 100%; }
      .icon-sm { width: 0.82em; height: 0.82em; }
      .icon-lg { width: 1.3em; height: 1.3em; }
      /* Archive page styles */
      .page-intro {
        max-width: var(--container);
        margin: 0 auto;
        padding: var(--sp-10) var(--sp-6) var(--sp-7);
        border-bottom: 1px solid var(--line);
      }
      .page-intro h1 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: clamp(2.4rem, 5.5vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--text);
        margin-bottom: var(--sp-5);
      }
      .page-intro h1 em {
        font-style: italic;
        color: var(--accent-rust);
        font-weight: 400;
      }
      .page-intro p {
        font-family: var(--font-serif);
        font-size: 1.05rem;
        color: var(--text-soft);
        max-width: 600px;
        line-height: 1.7;
      }

      .filter-bar {
        max-width: var(--container);
        margin: 0 auto;
        padding: var(--sp-6) var(--sp-6) var(--sp-5);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sp-3);
        border-bottom: 1px solid var(--line);
      }
      .filter-bar .bar-label {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-right: var(--sp-3);
      }
      .filter-btn {
        font-family: var(--font-sans);
        font-size: 0.82rem;
        padding: 7px 14px;
        border-radius: 999px;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text-soft);
        cursor: pointer;
        transition: all var(--dur-fast);
      }
      .filter-btn:hover {
        color: var(--text);
        border-color: var(--accent-rust);
      }
      .filter-btn.is-active {
        background: var(--accent-rust);
        color: var(--ink-950);
        border-color: var(--accent-rust);
        font-weight: 600;
      }

      /* Tag pills */
      .cat-pills {
        max-width: var(--container);
        margin: 0 auto;
        padding: var(--sp-5) var(--sp-6);
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .cat-pills a {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        padding: 5px 12px;
        border-radius: 6px;
        background: var(--bg-soft);
        border: 1px solid var(--line);
        color: var(--text-soft);
        text-decoration: none;
        transition: all var(--dur-fast);
      }
      .cat-pills a:hover {
        color: var(--accent-rust);
        border-color: var(--accent-rust);
      }
      .cat-pills a.is-active {
        background: var(--accent-rust);
        color: var(--ink-950);
        border-color: var(--accent-rust);
      }

      /* Article list */
      .article-list {
        max-width: var(--container);
        margin: 0 auto;
        padding: var(--sp-6) var(--sp-6) var(--sp-10);
      }
      .article-row {
        display: grid;
        grid-template-columns: 80px 1fr auto;
        gap: var(--sp-6);
        padding: var(--sp-6) 0;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
        color: inherit;
        transition: padding var(--dur-fast);
        align-items: start;
      }
      .article-row:hover {
        padding-left: var(--sp-3);
      }
      .article-row .art-date {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--text-dim);
        letter-spacing: 0.05em;
        padding-top: 6px;
      }
      .article-row .art-body {
        min-width: 0;
      }
      .article-row .art-body h3 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 1.5rem;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--text);
        margin: 0 0 var(--sp-2);
        transition: color var(--dur-fast);
      }
      .article-row:hover .art-body h3 {
        color: var(--accent-rust);
      }
      .article-row .art-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: var(--sp-3);
      }
      .article-row .art-meta .tag {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        padding: 3px 10px;
        border-radius: 4px;
        background: var(--bg-soft);
        color: var(--text-dim);
        border: 1px solid var(--line);
      }
      .article-row .art-meta .tag.cat {
        background: transparent;
        color: var(--accent-rust);
        border-color: rgba(201, 119, 47, 0.35);
      }
      .article-row p {
        font-family: var(--font-serif);
        color: var(--text-soft);
        font-size: 0.95rem;
        line-height: 1.65;
        margin: 0;
      }
      .article-row .arrow {
        font-family: var(--font-mono);
        color: var(--text-dim);
        font-size: 0.85rem;
        padding-top: 10px;
        transition:
          transform var(--dur-fast),
          color var(--dur-fast);
      }
      .article-row:hover .arrow {
        color: var(--accent-rust);
        transform: translateX(6px);
      }

      @media (max-width: 700px) {
        .article-row {
          grid-template-columns: 70px 1fr;
        }
        .article-row .arrow {
          display: none;
        }
        .article-row .art-body h3 {
          font-size: 1.2rem;
        }
      }

      /* Empty state */
      .empty {
        text-align: center;
        padding: var(--sp-10) var(--sp-6);
        color: var(--text-dim);
        font-family: var(--font-display);
        font-size: 1.4rem;
      }
    </style>
  </head>

    <script src="articles.js"></script>
    <script>
      (function () {
        var MOON_SVG = '<path d="M21 13.5A9 9 0 0 1 10.5 3a7.5 7.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>';
        var SUN_SVG = '<circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
        var saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.dataset.theme = saved;
        var ti = document.querySelector('#theme-toggle .theme-icon');
        if (ti) ti.innerHTML = saved === 'light' ? SUN_SVG : MOON_SVG;
        var toggle = document.getElementById('theme-toggle');
        if (toggle)
          toggle.addEventListener('click', function () {
            var cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = cur;
            localStorage.setItem('theme', cur);
            if (ti) ti.innerHTML = cur === 'light' ? SUN_SVG : MOON_SVG;
          });

        // Back to top
        var back = document.getElementById('back-to-top');
        if (back) {
          window.addEventListener('scroll', function () {
            back.classList.toggle('visible', window.scrollY > 500);
          });
          back.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }

        // Mobile menu toggle
        var menuBtn = document.getElementById('menu-toggle');
        var navLinks = document.getElementById('nav-links');
        if (menuBtn && navLinks) {
          menuBtn.addEventListener('click', function () {
            navLinks.classList.toggle('is-open');
          });
        }

        // Articles data — 由 articles.js 提供 (window.articles)
        var articles = window.articles;

        // Sort by date desc
        articles.sort(function (a, b) {
          return b.date.localeCompare(a.date);
        });

        // State
        var state = { cat: 'all', tag: 'all' };

        // Apply URL params
        var params = new URLSearchParams(window.location.search);
        if (params.get('cat')) state.cat = params.get('cat');
        if (params.get('tag')) state.tag = params.get('tag');

        // 从 articles 中提取所有分类（去重，保持原顺序）
        var categories = [];
        articles.forEach(function (a) {
          if (categories.indexOf(a.category) === -1) categories.push(a.category);
        });

        // 从 articles 中提取所有标签（去重）
        var tagSet = {};
        articles.forEach(function (a) {
          (a.tags || []).forEach(function (t) { tagSet[t] = true; });
        });
        var tags = Object.keys(tagSet);

        // 动态渲染分类按钮
        var catBar = document.getElementById('cat-bar');
        var catButtons = ['<button class="filter-btn" data-cat="all">全部</button>'].concat(
          categories.map(function (c) {
            return '<button class="filter-btn" data-cat="' + c + '">' + c + '</button>';
          })
        );
        catBar.insertAdjacentHTML('beforeend', catButtons.join(''));

        // 动态渲染标签云
        var tagPills = document.getElementById('tag-pills');
        var tagLinks = ['<a href="#" data-tag="all">全标签</a>'].concat(
          tags.map(function (t) {
            return '<a href="#" data-tag="' + t + '">' + t + '</a>';
          })
        );
        tagPills.innerHTML = tagLinks.join('');

        // UI: set active filter btn
        document.querySelectorAll('.filter-btn').forEach(function (btn) {
          btn.classList.toggle('is-active', btn.dataset.cat === state.cat);
          btn.addEventListener('click', function () {
            state.cat = btn.dataset.cat;
            state.tag = 'all';
            document.querySelectorAll('.filter-btn').forEach(function (b) {
              b.classList.toggle('is-active', b === btn);
            });
            document.querySelectorAll('#tag-pills a').forEach(function (a) {
              a.classList.toggle('is-active', a.dataset.tag === 'all');
            });
            render();
          });
        });
        document.querySelectorAll('#tag-pills a').forEach(function (a) {
          a.classList.toggle('is-active', a.dataset.tag === state.tag);
          a.addEventListener('click', function (e) {
            e.preventDefault();
            state.tag = a.dataset.tag;
            document.querySelectorAll('#tag-pills a').forEach(function (x) {
              x.classList.toggle('is-active', x === a);
            });
            render();
          });
        });

        // Render
        function render() {
          var list = document.getElementById('article-list');
          var filtered = articles.filter(function (a) {
            var ok = state.cat === 'all' || a.category === state.cat;
            if (ok && state.tag !== 'all') ok = (a.tags || []).indexOf(state.tag) >= 0;
            return ok;
          });
          if (filtered.length === 0) {
            list.innerHTML = '<div class="empty">该筛选下暂无内容</div>';
            return;
          }
          list.innerHTML = filtered
            .map(function (a) {
              var tags = (a.tags || [])
                .map(function (t) {
                  return '<span class="tag">' + t + '</span>';
                })
                .join('');
              return (
                '<a class="article-row" href="' +
                a.url +
                '">' +
                '<div class="art-date">' +
                a.date.replace(/-/g, ' · ') +
                '</div>' +
                '<div class="art-body">' +
                '<div class="art-meta"><span class="tag cat">' +
                a.category +
                '</span>' +
                tags +
                '</div>' +
                '<h3>' +
                a.title +
                '</h3>' +
                '<p>' +
                a.summary +
                '</p>' +
                '</div>' +
                '<div class="arrow">→</div>' +
                '</a>'
              );
            })
            .join('');
        }
        render();
      })();
    </script>
