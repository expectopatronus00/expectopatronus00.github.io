    <meta
      name="description"
      content="按时间倒序排列的全部笔记：AI 编程、AI 工具、AI 基础设施、运维部署、量化投资、效率成长与生活记录。"
    />

    <link rel="preload" href="fonts/CormorantGaramond-var-normal.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="design-tokens.css" />

    <style>
      /* SVG 图标工具类 */
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1em;
        height: 1em;
        vertical-align: -0.125em;
        color: currentColor;
        flex-shrink: 0;
      }
      .icon svg {
        width: 100%;
        height: 100%;
      }
      .icon-sm {
        width: 0.82em;
        height: 0.82em;
      }
      .icon-lg {
        width: 1.3em;
        height: 1.3em;
      }

      /* ---------- 页头 ---------- */
      .page-intro {
        max-width: var(--container);
        margin: 0 auto;
        padding: var(--sp-10) var(--sp-6) var(--sp-7);
      }
      .page-intro h1 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: clamp(2.4rem, 5.5vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--text);
        margin: 0 0 var(--sp-5);
      }
      .page-intro h1 em {
        font-style: italic;
        color: var(--accent-rust);
        font-weight: 400;
      }
      .page-intro p {
        font-family: var(--font-serif);
        font-size: 1.05rem;
        color: var(--text-soft);
        max-width: 620px;
        line-height: 1.7;
        margin: 0;
      }
      /* 计数条：把「共 N 篇」拆成原创 / 转载两个诚实数字 */
      .intro-counts {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-5);
        margin-top: var(--sp-5);
        font-family: var(--font-mono);
        font-size: 0.76rem;
        color: var(--text-dim);
        letter-spacing: 0.06em;
      }
      .intro-counts b {
        font-weight: 600;
        color: var(--text-soft);
        font-variant-numeric: lining-nums;
      }
      .intro-counts .is-original b {
        color: var(--accent-jade-text);
      }

      /* ---------- 搜索 ---------- */
      .search-bar {
        max-width: var(--container);
        margin: 0 auto;
        padding: 0 var(--sp-6) var(--sp-5);
      }
      .search-field {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--bg-soft);
        padding: 0 var(--sp-4);
        transition: border-color var(--dur-fast);
      }
      .search-field:focus-within {
        border-color: var(--accent-rust);
      }
      .search-field .icon {
        color: var(--text-dim);
        font-size: 1rem;
      }
      .search-field input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 0.95rem;
        padding: 12px 0;
      }
      .search-field input::placeholder {
        color: var(--text-dim);
      }
      .search-field kbd {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--text-dim);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 2px 6px;
        line-height: 1.4;
      }
      .search-clear {
        display: none;
        border: 0;
        background: transparent;
        color: var(--text-dim);
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        padding: 4px;
      }
      .search-clear:hover {
        color: var(--accent-rust);
      }
      .search-field.has-value .search-clear {
        display: block;
      }
      .search-field.has-value kbd {
        display: none;
      }

      /* ---------- 主题筛选 ---------- */
      .filter-bar {
        max-width: var(--container);
        margin: 0 auto;
        padding: 0 var(--sp-6) var(--sp-6);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sp-2);
        border-bottom: 1px solid var(--line);
      }
      .filter-bar .bar-label {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-right: var(--sp-2);
      }
      .filter-btn {
        font-family: var(--font-sans);
        font-size: 0.82rem;
        padding: 6px 13px;
        border-radius: 999px;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text-soft);
        cursor: pointer;
        transition:
          color var(--dur-fast),
          border-color var(--dur-fast),
          background var(--dur-fast);
      }
      .filter-btn:hover {
        color: var(--text);
        border-color: var(--accent-rust);
      }
      .filter-btn.is-active {
        background: var(--accent-rust);
        color: var(--ink-950);
        border-color: var(--accent-rust);
        font-weight: 600;
      }
      .filter-btn .n {
        margin-left: 6px;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        opacity: 0.6;
      }
      .filter-btn.is-active .n {
        opacity: 0.75;
      }

      /* ---------- 归档列表 ---------- */
      .archive {
        max-width: var(--container);
        margin: 0 auto;
        padding: var(--sp-6) var(--sp-6) var(--sp-10);
      }
      /* 月份分节头 */
      .month-head {
        display: flex;
        align-items: baseline;
        gap: var(--sp-4);
        padding: var(--sp-6) 0 var(--sp-3);
      }
      .month-head .m-label {
        font-family: var(--font-mono);
        font-size: 0.74rem;
        letter-spacing: 0.1em;
        color: var(--accent-rust-text);
        white-space: nowrap;
      }
      .month-head .m-line {
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .month-head .m-count {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--text-dim);
        white-space: nowrap;
      }

      .article-row {
        display: grid;
        /* 日期列 108px：「2026 · 07 · 19」在 mono 0.76rem 下实测要 100px，
           92px 会把最后一位数字裁掉 */
        grid-template-columns: 108px 1fr;
        gap: var(--sp-5);
        padding: var(--sp-4) var(--sp-2) var(--sp-4) 0;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
        color: inherit;
        transition:
          padding-left var(--dur-fast),
          border-color var(--dur-fast);
        align-items: start;
      }
      .article-row:hover {
        padding-left: var(--sp-2);
        border-color: var(--accent-rust);
      }
      .article-row .art-date {
        font-family: var(--font-mono);
        font-size: 0.76rem;
        color: var(--text-dim);
        letter-spacing: 0.04em;
        padding-top: 5px;
        white-space: nowrap;
        font-variant-numeric: lining-nums;
      }
      .article-row .art-body {
        min-width: 0;
      }
      .article-row .art-title {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--sp-2);
        margin-bottom: 6px;
      }
      .article-row h3 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 1.32rem;
        line-height: 1.28;
        letter-spacing: -0.005em;
        color: var(--text);
        margin: 0;
        transition: color var(--dur-fast);
      }
      .article-row:hover h3 {
        color: var(--accent-rust);
      }
      /* 来源徽章：把「抖音 / 小红书 / 微信」从分类槽位里拿出来 */
      .badge {
        font-family: var(--font-mono);
        font-size: 0.64rem;
        line-height: 1.5;
        padding: 1px 7px;
        border-radius: var(--r-sm);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .badge.src {
        background: var(--bg-soft);
        color: var(--text-dim);
        border: 1px solid var(--line);
      }
      .badge.src.is-original {
        color: var(--accent-jade-text);
        border-color: rgba(74, 158, 127, 0.4);
        background: transparent;
      }
      .badge.cat {
        color: var(--accent-rust-text);
        border: 1px solid rgba(184, 88, 29, 0.35);
        background: transparent;
      }
      .article-row p {
        font-family: var(--font-serif);
        color: var(--text-soft);
        font-size: 0.94rem;
        line-height: 1.6;
        margin: 0;
        /* 摘要只留两行，长摘要不再把列表拉长 */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* ---------- 空状态 ---------- */
      .empty {
        text-align: center;
        padding: var(--sp-10) var(--sp-6);
        color: var(--text-dim);
        font-family: var(--font-display);
        font-size: 1.4rem;
      }
      .empty span {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        margin-top: var(--sp-3);
        letter-spacing: 0.04em;
      }

      /* ---------- 系列入口 ---------- */
      .series-strip {
        max-width: var(--container);
        margin: 0 auto;
        padding: var(--sp-7) var(--sp-6) 0;
      }
      .series-strip .strip-head {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: var(--sp-4);
      }
      .series-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--sp-4);
      }
      .series-card {
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: var(--sp-4) var(--sp-5);
        text-decoration: none;
        color: inherit;
        background: var(--bg-soft);
        transition:
          border-color var(--dur-fast),
          transform var(--dur-fast);
      }
      .series-card:hover {
        border-color: var(--accent-rust);
        transform: translateY(-2px);
      }
      .series-card .s-name {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--text);
        margin-bottom: 6px;
      }
      .series-card .s-desc {
        font-family: var(--font-serif);
        font-size: 0.86rem;
        line-height: 1.55;
        color: var(--text-dim);
        margin: 0 0 10px;
      }
      .series-card .s-meta {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--accent-rust-text);
        letter-spacing: 0.06em;
      }

      @media (max-width: 900px) {
        .series-cards {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 700px) {
        .page-intro {
          padding: var(--sp-8) var(--sp-4) var(--sp-5);
        }
        .search-bar,
        .filter-bar,
        .archive,
        .series-strip {
          padding-left: var(--sp-4);
          padding-right: var(--sp-4);
        }
        .article-row {
          grid-template-columns: 1fr;
          gap: var(--sp-1);
        }
        .article-row .art-date {
          padding-top: 0;
          font-size: 0.7rem;
        }
        .article-row h3 {
          font-size: 1.1rem;
        }
        .filter-btn {
          max-width: 100%;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
      }
    </style>
  </head>

    <script src="articles.js"></script>
    <script>
      (function () {
        var MOON_SVG =
          '<path d="M21 13.5A9 9 0 0 1 10.5 3a7.5 7.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>';
        var SUN_SVG =
          '<circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';

        /* ---------- 主题 ---------- */
        var saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.dataset.theme = saved;
        var ti = document.querySelector('#theme-toggle .theme-icon');
        if (ti) ti.innerHTML = saved === 'light' ? SUN_SVG : MOON_SVG;
        var toggle = document.getElementById('theme-toggle');
        if (toggle)
          toggle.addEventListener('click', function () {
            var cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = cur;
            localStorage.setItem('theme', cur);
            if (ti) ti.innerHTML = cur === 'light' ? SUN_SVG : MOON_SVG;
          });

        /* ---------- 返回顶部 ---------- */
        var back = document.getElementById('back-to-top');
        if (back) {
          window.addEventListener('scroll', function () {
            back.classList.toggle('visible', window.scrollY > 500);
          });
          back.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }

        /* ---------- 移动端菜单 ---------- */
        var menuBtn = document.getElementById('menu-toggle');
        var navLinks = document.getElementById('nav-links');
        if (menuBtn && navLinks) {
          menuBtn.addEventListener('click', function () {
            navLinks.classList.toggle('is-open');
          });
        }

        /* ---------- 数据 ---------- */
        var BLOG = window.BLOG;
        var articles = BLOG.visible; // 已按日期倒序，已剔除合并掉的重复文章

        /* ---------- 计数条 ---------- */
        // 注意：第一段必须是纯文本「共 N 篇」，scripts/repo-lint.cjs 用 /共\s*(\d+)\s*篇/ 校验
        var counts = document.getElementById('intro-counts');
        if (counts) {
          var merged = BLOG.count.total - BLOG.count.visible;
          counts.innerHTML =
            '<span>共 ' + BLOG.count.total + ' 篇</span>' +
            '<span class="is-original">原创 ' + BLOG.count.original + ' 篇</span>' +
            '<span>转载 ' + (BLOG.count.total - BLOG.count.original) + ' 篇</span>' +
            (merged > 0 ? '<span>' + merged + ' 篇同题内容已并入系列长文</span>' : '');
        }

        /* ---------- 主题筛选 ---------- */
        var state = { cat: 'all', q: '' };

        var params = new URLSearchParams(window.location.search);
        if (params.get('cat')) state.cat = params.get('cat');
        if (params.get('q')) state.q = params.get('q').trim().toLowerCase();

        var catBar = document.getElementById('cat-bar');
        var catButtons = [
          '<button class="filter-btn" data-cat="all">全部<span class="n">' + articles.length + '</span></button>'
        ];
        BLOG.categories.forEach(function (c) {
          var n = BLOG.inCategory(c.name).length;
          if (n === 0) return;
          catButtons.push(
            '<button class="filter-btn" data-cat="' +
              c.name +
              '">' +
              c.name +
              '<span class="n">' +
              n +
              '</span></button>'
          );
        });
        catBar.insertAdjacentHTML('beforeend', catButtons.join(''));

        var catBtns = catBar.querySelectorAll('.filter-btn');
        function syncCatButtons() {
          for (var i = 0; i < catBtns.length; i++) {
            catBtns[i].classList.toggle('is-active', catBtns[i].dataset.cat === state.cat);
          }
        }
        for (var bi = 0; bi < catBtns.length; bi++) {
          catBtns[bi].addEventListener('click', function () {
            state.cat = this.dataset.cat;
            syncCatButtons();
            render();
          });
        }
        syncCatButtons();

        /* ---------- 系列入口 ---------- */
        var strip = document.getElementById('series-strip');
        if (strip) {
          var cards = BLOG.series
            .map(function (s) {
              var n = BLOG.inSeries(s.id).length;
              return (
                '<a class="series-card" href="series.html#' +
                s.id +
                '">' +
                '<div class="s-name">' +
                s.name +
                '</div>' +
                '<p class="s-desc">' +
                s.desc +
                '</p>' +
                '<div class="s-meta">' +
                n +
                ' 篇 · 按顺序阅读 →</div>' +
                '</a>'
              );
            })
            .join('');
          strip.innerHTML =
            '<div class="strip-head">系列连载 · series</div><div class="series-cards">' + cards + '</div>';
        }

        /* ---------- 搜索 ---------- */
        var field = document.getElementById('search-field');
        var input = document.getElementById('q');
        var clearBtn = document.getElementById('q-clear');

        function setQuery(v) {
          state.q = v.trim().toLowerCase();
          field.classList.toggle('has-value', v.length > 0);
          render();
        }

        if (input) {
          // 支持从文章页搜索链接带过来的 ?q=
          if (state.q) {
            input.value = state.q;
            field.classList.add('has-value');
          }
          input.addEventListener('input', function () {
            setQuery(this.value);
          });
          // 「/」聚焦搜索框，和主流阅读器一致
          document.addEventListener('keydown', function (e) {
            if (e.key === '/' && document.activeElement !== input) {
              e.preventDefault();
              input.focus();
            }
            if (e.key === 'Escape' && document.activeElement === input) {
              input.value = '';
              setQuery('');
              input.blur();
            }
          });
        }
        if (clearBtn) {
          clearBtn.addEventListener('click', function () {
            input.value = '';
            setQuery('');
            input.focus();
          });
        }

        /* ---------- 匹配 ---------- */
        function matches(a) {
          if (state.cat !== 'all' && a.category !== state.cat) return false;
          if (!state.q) return true;
          var hay = (a.title + ' ' + a.summary + ' ' + (a.tags || []).join(' ') + ' ' + a.category).toLowerCase();
          // 空格分隔的多个词要全部命中
          var terms = state.q.split(/\s+/);
          for (var i = 0; i < terms.length; i++) {
            if (terms[i] && hay.indexOf(terms[i]) === -1) return false;
          }
          return true;
        }

        /* ---------- 渲染 ---------- */
        function rowHTML(a, showCat) {
          var srcCls = a.original ? 'badge src is-original' : 'badge src';
          return (
            '<a class="article-row" href="' +
            a.url +
            '">' +
            '<div class="art-date">' +
            a.date.slice(0, 10).replace(/-/g, ' · ') +
            '</div>' +
            '<div class="art-body">' +
            '<div class="art-title">' +
            '<h3>' +
            a.title +
            '</h3>' +
            '<span class="' +
            srcCls +
            '">' +
            a.source +
            '</span>' +
            (showCat ? '<span class="badge cat">' + a.category + '</span>' : '') +
            '</div>' +
            '<p>' +
            a.summary +
            '</p>' +
            '</div>' +
            '</a>'
          );
        }

        function render() {
          var box = document.getElementById('archive');
          var list = articles.filter(matches);
          var showCat = state.cat === 'all';

          if (list.length === 0) {
            box.innerHTML =
              '<div class="empty">没有找到匹配的文章<span>换个关键词，或点「全部」回到完整归档</span></div>';
            return;
          }

          // 按月分组，给长列表一个可扫读的骨架
          var html = '';
          var curMonth = '';
          for (var i = 0; i < list.length; i++) {
            var a = list[i];
            var m = a.date.slice(0, 7).replace('-', ' · ');
            if (m !== curMonth) {
              curMonth = m;
              var nInMonth = 0;
              for (var j = i; j < list.length; j++) {
                if (list[j].date.slice(0, 7) === a.date.slice(0, 7)) nInMonth++;
              }
              html +=
                '<div class="month-head"><span class="m-label">' +
                m +
                '</span><span class="m-line"></span><span class="m-count">' +
                nInMonth +
                ' 篇</span></div>';
            }
            html += rowHTML(a, showCat);
          }
          box.innerHTML = html;
        }

        render();
      })();
    </script>
  </body>
</html>
