<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="expectopatronus logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151f"/>
      <stop offset="100%" stop-color="#0b0d16"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#b8581d" stroke-width="1.5"/>
  <!-- 装饰弧线 -->
  <path d="M 18 22 Q 32 16 46 22" fill="none" stroke="#b8581d" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M 18 42 Q 32 48 46 42" fill="none" stroke="#b8581d" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- 字母 E（衬线风格）-->
  <text x="32" y="39" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" font-weight="500" fill="#ede9df">E</text>
  <!-- 中央强调点 -->
  <circle cx="32" cy="18" r="1.8" fill="#b8581d"/>
</svg>
