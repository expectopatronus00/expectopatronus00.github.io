    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          if (t === 'light') document.documentElement.dataset.theme = 'light';
        } catch (e) {}
      })();
    </script>

    <style>
      /* ── SVG 图标工具类（与主站 index.html 同款） ── */
      .icon { display: inline-flex; align-items: center; justify-content: center; width: 1em; height: 1em; vertical-align: -0.125em; color: currentColor; flex-shrink: 0; }
      .icon svg { width: 100%; height: 100%; }
      .icon-lg { width: 1.3em; height: 1.3em; }

      /* ── 页头（编辑志版式，与主站 about/series 同构） ── */
      .page-head {
        max-width: 1080px;
        margin: 0 auto;
        padding: var(--sp-10) var(--sp-6) var(--sp-6);
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent-rust-text);
        margin-bottom: var(--sp-4);
      }
      .page-head h1 {
        font-family: var(--font-display);
        font-size: var(--fs-5xl);
        font-weight: 500;
        line-height: 1.15;
        color: var(--text);
        margin: 0 0 var(--sp-4);
      }
      .page-head h1 em {
        font-style: italic;
        color: var(--accent-rust-text);
      }
      .page-lede {
        max-width: 34em;
        font-size: var(--fs-lg);
        line-height: 1.8;
        color: var(--text-dim);
        margin: 0;
      }
      .page-lede strong { color: var(--text-soft); font-weight: 600; }

      /* ── 搜索 + 统计 ── */
      .search-row {
        max-width: 1080px;
        margin: 0 auto;
        padding: var(--sp-6) var(--sp-6) 0;
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-4);
        align-items: center;
      }
      .search-box {
        flex: 1 1 320px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg-card);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 12px 16px;
        color: var(--text-dim);
        transition: border-color var(--dur-fast);
      }
      .search-box:focus-within {
        border-color: var(--accent-rust);
        box-shadow: var(--shadow-glow-rust);
      }
      .search-box input {
        flex: 1;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--text);
        font-family: var(--font-serif);
        font-size: var(--fs-base);
      }
      .search-box input::placeholder { color: var(--text-dim); }
      .search-box kbd {
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--text-dim);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 1px 7px;
      }
      .nav-stats {
        font-family: var(--font-mono);
        font-size: var(--fs-sm);
        color: var(--text-dim);
        white-space: nowrap;
      }
      .nav-stats strong { color: var(--accent-rust-text); font-weight: 600; }

      /* ── 分类筛选 ── */
      .cat-bar {
        max-width: 1080px;
        margin: 0 auto;
        padding: var(--sp-4) var(--sp-6) 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .cat-btn {
        font-family: var(--font-sans);
        font-size: var(--fs-sm);
        color: var(--text-soft);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 16px;
        cursor: pointer;
        transition: color var(--dur-fast), border-color var(--dur-fast), background var(--dur-fast);
      }
      .cat-btn:hover { color: var(--text); border-color: var(--ink-600); }
      .cat-btn.active {
        color: var(--accent-rust-text);
        border-color: var(--accent-rust);
        background: rgba(184, 88, 29, 0.12);
      }

      /* ── 分类区块 ── */
      .nav-main {
        max-width: 1080px;
        margin: 0 auto;
        padding: var(--sp-7) var(--sp-6) var(--sp-10);
      }
      .cat-section { margin-bottom: var(--sp-9); }
      .cat-head {
        display: flex;
        align-items: center;
        gap: var(--sp-4);
        padding-bottom: var(--sp-4);
        border-bottom: 1px solid var(--line);
        margin-bottom: var(--sp-5);
      }
      .cat-glyph {
        flex: none;
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        color: var(--accent-rust-text);
      }
      .cat-glyph svg { width: 22px; height: 22px; }
      .cat-title {
        font-family: var(--font-display);
        font-size: var(--fs-2xl);
        font-weight: 500;
        color: var(--text);
        margin: 0;
        line-height: 1.2;
      }
      .cat-sub {
        font-size: var(--fs-sm);
        color: var(--text-dim);
        margin: 2px 0 0;
      }
      .cat-count {
        margin-left: auto;
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--text-dim);
        white-space: nowrap;
      }

      /* ── 列表（与主站归档页同构的行式布局） ── */
      .tool-list {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--line);
      }
      .tool-card {
        display: grid;
        grid-template-columns: 210px 1fr auto;
        gap: var(--sp-5);
        align-items: start;
        padding: var(--sp-4) var(--sp-2);
        border-bottom: 1px solid var(--line);
        text-decoration: none;
        transition: background var(--dur-fast);
      }
      .tool-card:hover { background: var(--bg-soft); }
      .tool-card:hover .tc-name { color: var(--accent-rust-text); }
      .tc-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .tc-name {
        font-family: var(--font-display);
        font-size: var(--fs-lg);
        font-weight: 600;
        color: var(--text);
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color var(--dur-fast);
      }
      .tc-badge {
        flex: none;
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        line-height: 1;
        padding: 4px 8px;
        border-radius: 999px;
        color: var(--accent-rust-text);
        border: 1px solid var(--accent-rust);
      }
      .tc-badge.free {
        color: var(--accent-jade-text);
        border-color: var(--accent-jade);
      }
      .tc-desc {
        font-size: var(--fs-sm);
        line-height: 1.7;
        color: var(--text-dim);
        margin: 0;
      }
      .tc-url {
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--ink-500);
        white-space: nowrap;
        justify-self: end;
        padding-top: 3px;
      }

      @media (max-width: 700px) {
        .tool-card {
          grid-template-columns: 1fr;
          gap: 4px;
          padding: var(--sp-4) var(--sp-1);
        }
        .tc-name { white-space: normal; }
        .tc-url { justify-self: start; padding-top: 0; }
      }

      /* ── 空态 / 加载 ── */
      .no-result {
        text-align: center;
        padding: var(--sp-10) 0;
        color: var(--text-dim);
      }
      .loading-note {
        text-align: center;
        padding: var(--sp-9) 0;
        font-family: var(--font-mono);
        font-size: var(--fs-sm);
        color: var(--text-dim);
      }

      /* ── 滚动显现 ── */
      .on-scroll {
        opacity: 0;
        transform: translateY(14px);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .on-scroll.is-in { opacity: 1; transform: none; }

      @media (max-width: 600px) {
        .page-head { padding-top: var(--sp-8); }
        .page-head h1 { font-size: var(--fs-4xl); }
        .nav-stats { width: 100%; }
      }
    </style>
    <noscript>
      <style>
        .on-scroll { opacity: 1 !important; transform: none !important; }
        .loading-note { display: none; }
      </style>
    </noscript>
  </head>

    <script>
      (function () {
        'use strict';

        /* ── 分类图标：id → 内联 SVG（全部 24×24 描边，跟随 currentColor） ── */
        var S = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">';
        var CAT_GLYPHS = {
          'cn-ai-chat': S + '<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4V6z"/><path d="M8 9h8M8 12h5"/></svg>',
          'intl-ai-chat': S + '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 2.6 4 5.6 4 9s-1.2 6.4-4 9c-2.8-2.6-4-5.6-4-9s1.2-6.4 4-9z"/></svg>',
          'ai-model': S + '<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>',
          'ai-coding': S + '<path d="m8 7-5 5 5 5M16 7l5 5-5 5M13 4l-2 16"/></svg>',
          'ai-agent': S + '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 7.8 10.5 16M16.5 7.8 13.5 16M8.5 6h7"/></svg>',
          'ai-image': S + '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 19 5.5-5.5L14 17l3-3 4 4"/></svg>',
          'ai-video': S + '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9.5 5 2.5-5 2.5v-5z"/></svg>',
          'ai-audio': S + '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
          'ai-learning': S + '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/><path d="M9 7h6"/></svg>',
          'ai-prompt': S + '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5c-.8.7-1 1.5-1 2.5h-6c0-1-.2-1.8-1-2.5A6 6 0 0 1 12 3z"/></svg>',
          'dev-tools': S + '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M12 15h5"/></svg>',
          'ai-news': S + '<circle cx="12" cy="12" r="2"/><path d="M7.7 7.7a6 6 0 0 0 0 8.6M16.3 7.7a6 6 0 0 1 0 8.6M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>'
        };

        /* ── 主题切换（与主站同一套 SVG / localStorage 键） ── */
        var MOON_SVG = '<path d="M21 13.5A9 9 0 0 1 10.5 3a7.5 7.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>';
        var SUN_SVG = '<circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
        var ti = document.querySelector('#theme-toggle .theme-icon');
        var saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.dataset.theme = saved;
        if (ti) ti.innerHTML = saved === 'light' ? SUN_SVG : MOON_SVG;
        document.getElementById('theme-toggle').addEventListener('click', function () {
          saved = saved === 'light' ? 'dark' : 'light';
          document.documentElement.dataset.theme = saved;
          localStorage.setItem('theme', saved);
          if (ti) ti.innerHTML = saved === 'light' ? SUN_SVG : MOON_SVG;
        });

        /* ── 移动端菜单（与主站同构） ── */
        var menuBtn = document.getElementById('menu-toggle');
        var navLinks = document.getElementById('nav-links');
        if (menuBtn && navLinks) {
          menuBtn.addEventListener('click', function () {
            navLinks.classList.toggle('is-open');
          });
        }

        var DATA = null;
        var state = { cat: 'all', q: '' };

        function domainOf(url) {
          var bare = url.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
          /* GitHub 仓库显示 owner/repo 路径，比光秃秃的 github.com 有用 */
          if (bare === 'github.com') {
            var path = url.replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '');
            return 'github.com/' + path;
          }
          return bare;
        }
        function badgeHtml(badge) {
          if (!badge) return '';
          var cls = badge.indexOf('免费') > -1 || badge.indexOf('开源') > -1 ? ' free' : '';
          return '<span class="tc-badge' + cls + '">' + badge + '</span>';
        }

        /* ── 一次性建 DOM；之后的搜索/筛选只切换显示，不重建 ── */
        function build(cats) {
          var main = document.getElementById('main-content');
          main.innerHTML = '';
          cats.forEach(function (cat) {
            var sec = document.createElement('section');
            sec.className = 'cat-section on-scroll';
            sec.dataset.cat = cat.id;
            sec.innerHTML =
              '<div class="cat-head">' +
              '<span class="cat-glyph">' + (CAT_GLYPHS[cat.id] || CAT_GLYPHS['ai-model']) + '</span>' +
              '<div><h2 class="cat-title">' + cat.name + '</h2>' +
              '<p class="cat-sub">' + cat.desc + '</p></div>' +
              '<span class="cat-count">' + cat.items.length + ' 个站点</span>' +
              '</div>' +
              '<div class="tool-list"></div>';
            var grid = sec.querySelector('.tool-list');
            cat.items.forEach(function (item) {
              var a = document.createElement('a');
              a.className = 'tool-card';
              a.href = item.url;
              a.target = '_blank';
              a.rel = 'noopener';
              a.dataset.hay = (item.name + ' ' + item.desc + ' ' + item.url).toLowerCase();
              a.innerHTML =
                '<div class="tc-head"><span class="tc-name">' + item.name + '</span>' +
                badgeHtml(item.badge) + '</div>' +
                '<p class="tc-desc">' + item.desc + '</p>' +
                '<div class="tc-url">' + domainOf(item.url) + '</div>';
              grid.appendChild(a);
            });
            main.appendChild(sec);
          });
          reveal();
        }

        /* ── 搜索 + 筛选：只切换 display ── */
        function apply() {
          var q = state.q.trim().toLowerCase();
          var cards = document.querySelectorAll('.tool-card');
          var anyVisible = false;
          for (var i = 0; i < cards.length; i++) {
            var card = cards[i];
            var inCat = state.cat === 'all' || card.closest('.cat-section').dataset.cat === state.cat;
            var hit = !q || card.dataset.hay.indexOf(q) !== -1;
            var show = inCat && hit;
            card.style.display = show ? '' : 'none';
            if (show) anyVisible = true;
          }
          var sections = document.querySelectorAll('.cat-section');
          for (var j = 0; j < sections.length; j++) {
            var visible = sections[j].querySelectorAll('.tool-card:not([style*="none"])').length;
            sections[j].style.display = visible ? '' : 'none';
          }
          var main = document.getElementById('main-content');
          var empty = main.querySelector('.no-result');
          if (!anyVisible) {
            if (!empty) {
              empty = document.createElement('div');
              empty.className = 'no-result';
              empty.innerHTML = '<p>没有匹配的工具，换个关键词试试。</p>';
              main.appendChild(empty);
            }
            empty.style.display = '';
          } else if (empty) {
            empty.style.display = 'none';
          }
        }

        function initCats(cats) {
          var bar = document.getElementById('cat-bar');
          var all = document.createElement('button');
          all.className = 'cat-btn active';
          all.textContent = '全部';
          all.dataset.cat = 'all';
          bar.appendChild(all);
          cats.forEach(function (c) {
            var b = document.createElement('button');
            b.className = 'cat-btn';
            b.textContent = c.name;
            b.dataset.cat = c.id;
            bar.appendChild(b);
          });
          bar.addEventListener('click', function (e) {
            if (e.target.tagName !== 'BUTTON') return;
            bar.querySelectorAll('.cat-btn').forEach(function (b) {
              b.classList.remove('active');
            });
            e.target.classList.add('active');
            state.cat = e.target.dataset.cat;
            apply();
          });
        }

        function initStats(cats) {
          var total = cats.reduce(function (s, c) {
            return s + c.items.length;
          }, 0);
          document.getElementById('nav-stats').innerHTML =
            '<strong>' + cats.length + '</strong> 个分类 · <strong>' + total + '</strong> 个站点';
        }

        /* ── 滚动显现 ── */
        function reveal() {
          if (!('IntersectionObserver' in window)) {
            document.querySelectorAll('.on-scroll').forEach(function (el) {
              el.classList.add('is-in');
            });
            return;
          }
          var io = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (en) {
                if (en.isIntersecting) {
                  en.target.classList.add('is-in');
                  io.unobserve(en.target);
                }
              });
            },
            { threshold: 0.08, rootMargin: '0px 0px -40px 0px' }
          );
          document.querySelectorAll('.on-scroll:not(.is-in)').forEach(function (el) {
            io.observe(el);
          });
        }

        /* ── 搜索框：/ 聚焦，Esc 清空 ── */
        var input = document.getElementById('search-input');
        input.addEventListener('input', function () {
          state.q = input.value;
          apply();
        });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            input.value = '';
            state.q = '';
            apply();
            input.blur();
          }
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === '/' && document.activeElement !== input) {
            e.preventDefault();
            input.focus();
          }
        });

        /* ── 数据加载 ── */
        fetch('./data.json')
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            var cats = data.categories.filter(function (c) {
              return c.items.length > 0;
            });
            DATA = cats;
            initStats(cats);
            initCats(cats);
            build(cats);
          })
          .catch(function () {
            document.getElementById('main-content').innerHTML =
              '<div class="no-result"><p>数据加载失败，请刷新页面。</p></div>';
          });
      })();
    </script>
  </body>
</html>
